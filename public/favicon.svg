<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Court-floor charcoal tile -->
  <rect width="512" height="512" rx="96" fill="#111827"/>
  <!-- Squash ball: pro double-yellow-dot -->
  <circle cx="368" cy="160" r="64" fill="#f5e000"/>
  <circle cx="350" cy="148" r="6" fill="#111827"/>
  <circle cx="386" cy="148" r="6" fill="#111827"/>
  <!-- Wordmark "B" with a notch suggesting a ball trace -->
  <text x="50%" y="370" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="900" font-size="320" fill="#ffffff" letter-spacing="-8">B</text>
  <!-- Tin: subtle red strip at the bottom -->
  <rect x="64" y="446" width="384" height="14" rx="7" fill="#e03a3a"/>
</svg>
